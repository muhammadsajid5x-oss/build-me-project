name: CI

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @about-me/web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm turbo run lint

      - name: Type Check
        run: pnpm turbo run typecheck

      - name: Run Tests
        run: pnpm turbo run test --filter='!@build-me/integration-tests'

      - name: Build
        run: pnpm turbo run build
