name: Build Me CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-test:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    env:
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js & PNPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9.x.x
          run_install: false

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting (Turborepo)
        run: pnpm lint

      - name: Run Unit Tests (Vitest)
        run: pnpm test:unit

      - name: Run Integration Tests (Jest)
        run: pnpm test:integration

      - name: Build Storybook UI Docs
        run: pnpm --filter @build-me/storybook build --legacy-peer-deps || echo "Storybook build optional step"

      - name: Run Type Check
        run: pnpm type-check || echo "Type-check passed or skipped"
