name: CD

on:
  workflow_run:
    workflows: ["CI Quality Gate"]
    types: [completed]

jobs:
  deploy-web-staging:
    name: Deploy Web (Staging)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.WEB_PROJECT_ID }}
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'development')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g vercel

      - name: Pull Vercel Environment
        working-directory: apps/web
        run: vercel pull --yes --environment=preview "--token=${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        working-directory: apps/web
        run: vercel build "--token=${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Preview
        working-directory: apps/web
        run: vercel deploy --prebuilt "--token=${{ secrets.VERCEL_TOKEN }}"

  deploy-web-production:
    name: Deploy Web (Production)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.WEB_PROJECT_ID }}
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g vercel

      - name: Pull Vercel Environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production "--token=${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        working-directory: apps/web
        run: vercel build --prod "--token=${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Production
        working-directory: apps/web
        run: vercel deploy --prebuilt --prod "--token=${{ secrets.VERCEL_TOKEN }}"
